<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电影海报墙 - 首页</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/index.css">
    <script>
        // 禁用 Service Worker 以支持 file:// 协议
        if (window.location.protocol === 'file:') {
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    registrations.forEach(registration => {
                        registration.unregister();
                    });
                }).catch(() => {
                    // 忽略错误
                });
            }
        }
    </script>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <a href="index.html" class="navbar-logo">
            🎬 电影墙
        </a>
        
        <ul class="navbar-nav">
            <li><a href="index.html" data-page="home" class="active">首页</a></li>
            <li><a href="favorites.html" data-page="favorites">收藏</a></li>
        </ul>
    </nav>
    
    <!-- 顶部展示区 (Full Screen Hero) -->
    <header class="hero" id="hero">
        <div class="loading">加载中...</div>
    </header>

    <!-- 静态操作按钮 -->
    <div class="hero-actions-static" id="hero-actions">
        <a id="hero-btn-detail" href="#" class="btn btn-glass">
            查看详情
        </a>
        <button id="hero-btn-fav" class="btn btn-fav" onclick="handleStaticFavorite()">
            ♥
        </button>
    </div>

    <!-- 底部轮播控制器 (Carousel Thumbnails) -->
    <div class="carousel-section-wrapper">
        <div class="carousel-thumbnails-container" id="carousel-thumbnails">
            <!-- 缩略图将通过JS插入 -->
        </div>
    </div>
    
    <!-- 脚本 -->
    <script src="/env.js" onerror="window.TMDB_TOKEN=window.TMDB_TOKEN||''"></script>
    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
</body>
</html>
